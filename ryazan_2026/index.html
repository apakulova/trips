<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e9">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Рязань · личный гайд</title>
  <style>
    body{margin:0;background:#f6f1e9;color:#191713;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .loading strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:36px;margin-bottom:8px}
    .loading span{color:#756f66;font-size:14px}
  </style>
</head>
<body>
  <div class="loading"><div><strong>Рязань</strong><span>Загружаю личный гайд…</span></div></div>
  <script>
    (async()=>{
      try{
        const version="20260916-2255";
        const [baseResponse,routeResponse,stylesResponse,weekendStylesResponse]=await Promise.all([
          fetch("base.html?v="+version,{cache:"no-store"}),
          fetch("friday-route.html?v="+version,{cache:"no-store"}),
          fetch("friday-route.css?v="+version,{cache:"no-store"}),
          fetch("weekend-route.css?v="+version,{cache:"no-store"})
        ]);
        if(!baseResponse.ok||!routeResponse.ok||!stylesResponse.ok||!weekendStylesResponse.ok)throw new Error("Не удалось загрузить файлы гайда");

        let page=await baseResponse.text();
        const route=await routeResponse.text();
        const styles=await stylesResponse.text();
        const weekendStyles=await weekendStylesResponse.text();
        page=page.replace("</style>",styles+"\n"+weekendStyles+"\n</style>");
        page=page.replace("30 карточек · 6 тематических разделов · практика поездки","30 карточек · маршрут на выходные · практика поездки");

        const tripChip='<a class="chip" href="#trip">🧳 Поездка <span>практика</span></a>';
        if(!page.includes('href="#friday-route"')){
          page=page.replace(tripChip,tripChip+'<a class="chip" href="#friday-route">🗺️ Маршрут на выходные <span>2 дня</span></a>');
        }

        const routeStart=page.indexOf('<section class="section" id="friday-route">');
        const kremlinStart=page.indexOf('<section class="section" id="kremlin">');
        page=routeStart!==-1&&kremlinStart>routeStart
          ? page.slice(0,routeStart)+route+page.slice(kremlinStart)
          : page.replace('<section class="section" id="kremlin">',route+'<section class="section" id="kremlin">');

        document.open();
        document.write(page);
        document.close();
      }catch(error){
        console.error(error);
        document.body.innerHTML='<div class="loading"><div><strong>Не удалось загрузить гайд</strong><span>Откройте <a href="base.html">основную версию</a> и обновите страницу чуть позже.</span></div></div>';
      }
    })();
  </script>
</body>
</html>
