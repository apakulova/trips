name: Update Ryazan route

on:
  push:
    paths:
      - 'ryazan_2026/route-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Friday route into guide
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('ryazan_2026/index.html')
          html = index.read_text(encoding='utf-8')
          route = Path('ryazan_2026/route-block.html').read_text(encoding='utf-8').strip() + '\n'
          styles = Path('ryazan_2026/route-styles.css').read_text(encoding='utf-8').strip() + '\n'

          if 'id="friday-route"' not in html:
              html = html.replace(
                  '<a class="chip" href="#trip">🧳 Поездка <span>практика</span></a>',
                  '<a class="chip" href="#trip">🧳 Поездка <span>практика</span></a><a class="chip" href="#friday-route">🗺️ Маршрут пятницы <span>1 день</span></a>',
                  1,
              )
              html = html.replace(
                  '30 карточек · 6 тематических разделов · практика поездки',
                  '30 карточек · маршрут пятницы · практика поездки',
                  1,
              )
              html = html.replace('</style>', '\n' + styles + '</style>', 1)
              html = html.replace('<section class="section" id="kremlin">', route + '<section class="section" id="kremlin">', 1)
              index.write_text(html, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- ryazan_2026/index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ryazan_2026/index.html
          git commit -m "Add Friday walking route to Ryazan guide"
          git push
